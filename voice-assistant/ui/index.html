<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Voice Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .titlebar {
      -webkit-app-region: drag;
      height: 38px;
      background: rgba(15, 23, 42, 0.9);
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-size: 13px;
      color: #94a3b8;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .container { flex: 1; display: flex; flex-direction: column; padding: 16px; }
    .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .message { padding: 12px 16px; border-radius: 12px; max-width: 80%; animation: fadeIn 0.3s; }
    .user { background: #3b82f6; align-self: flex-end; }
    .assistant { background: #1e293b; border: 1px solid #334155; align-self: flex-start; }
    .input-area { display: flex; gap: 8px; padding: 16px; border-top: 1px solid rgba(255,255,255,0.05); }
    input { flex: 1; padding: 12px 16px; border-radius: 24px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; outline: none; }
    input:focus { border-color: #3b82f6; }
    button {
      padding: 12px 24px; border-radius: 24px; border: none;
      background: #3b82f6; color: white; cursor: pointer; font-weight: 600;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    .record-btn { background: #ef4444; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .record-btn.recording { animation: pulse 1s infinite; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .status { text-align: center; color: #64748b; font-size: 12px; padding: 4px; }
  </style>
</head>
<body>
  <div class="titlebar">Voice Assistant</div>
  <div class="container">
    <div class="messages" id="messages"></div>
    <div class="status" id="status">Ready</div>
    <div class="input-area">
      <button class="record-btn" id="recordBtn">&#127908;</button>
      <input id="input" placeholder="Type a message...">
      <button id="sendBtn">Send</button>
    </div>
  </div>
  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const recordBtn = document.getElementById('recordBtn');
    const statusEl = document.getElementById('status');

    function addMessage(text, role) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function sendMessage(text) {
      if (!text.trim()) return;
      addMessage(text, 'user');
      inputEl.value = '';
      statusEl.textContent = 'Thinking...';
      try {
        const res = await fetch('http://localhost:8004/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        const data = await res.json();
        addMessage(data.response, 'assistant');
        statusEl.textContent = 'Ready';
      } catch(e) {
        addMessage('Error: Backend not running', 'assistant');
        statusEl.textContent = 'Error';
      }
    }

    sendBtn.addEventListener('click', () => sendMessage(inputEl.value));
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(inputEl.value); });

    let recording = false;
    recordBtn.addEventListener('click', async () => {
      recording = !recording;
      recordBtn.classList.toggle('recording', recording);
      statusEl.textContent = recording ? 'Recording...' : 'Processing...';
      if (recording) {
        try {
          const res = await fetch('http://localhost:8004/record', { method: 'POST' });
          const data = await res.json();
          if (data.text) {
            addMessage(data.text, 'user');
            addMessage(data.response, 'assistant');
          }
        } catch(e) {
          addMessage('Error: Backend not running', 'assistant');
        }
        recordBtn.classList.remove('recording');
        statusEl.textContent = 'Ready';
        recording = false;
      }
    });
  </script>
</body>
</html>
